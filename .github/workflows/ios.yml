name: Build iOS (unsigned IPA)

# 为什么这样：家里没有 Mac ⇒ 编译放 GitHub 的 macOS runner（云上），签名的 IPA 用 SideStore/AltStore 在手机上签。
# ⛔ 这一步**不签名**（unsigned）—— 只证明"云端能编出可安装的壳"。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15          # ⚠️ 2026-09-26 改：macos-14 上默认是 Xcode 15.4，读不了 XcodeGen 生成的"future project file format (77)"（第一次跑就死在这儿）⇒ 换 macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select newest Xcode
        # 为什么加：**必须让"生成工程"和"编译工程"用同一个 Xcode**，
        # 否则新 XcodeGen 生成的工程格式（objectVersion 77）会被旧 xcodebuild 拒读。
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Get Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project AmbraVoice.xcodeproj \
            -scheme AmbraVoice \
            -archivePath build/App.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Ad-hoc sign the app (so the IPA has a signature structure)
        # 为什么加：不加这一步，打出来的 IPA 里一个签名结构都没有，
        # Sideloadly 会直接判 `Invalid file`（2026-09-26 第一轮真机实测）。
        # `--sign -` 是 ad-hoc 签名；Sideloadly 之后会用他自己的证书重签一遍。
        run: |
          APP=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "signing: $APP"
          codesign --force --sign - --timestamp=none "$APP" || true
          codesign -dv "$APP" 2>&1 | head -20 || true
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r AmbraVoice-unsigned.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/AmbraVoice-unsigned.ipa
          retention-days: 14
